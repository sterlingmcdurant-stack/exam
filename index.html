<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1A73E8"><title>EXAMHOUSE – Join Exam</title><link rel="stylesheet" href="css/style.css"><script src="js/diag.js"></script></head><body data-page="join"><div class="wrap"><div class="brand"><div class="logo">🎓</div><h1>EXAMHOUSE</h1><p>Online exams for Junior High School</p></div><div class="card"><h2>Join your exam</h2><form id="join"><label>Full Name</label><input id="name" autocomplete="name" placeholder="e.g. Kofi Mensah" required>

<label>Subject</label><select id="subject" required><option value="">Select subject</option><option>English</option><option>Maths</option><option>Integrated Science</option><option>Social Studies</option><option>R.M.E</option><option>ICT</option><option>French</option><option>Ghanaian Language (Twi)</option><option>Creative Arts</option><option>Career Tech</option></select><label>Exam Code</label><input id="code" style="text-transform:uppercase" placeholder="e.g. MATH-JHS2-4821" required>
